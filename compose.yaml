
services:
  postgres:
    image: postgres:16
    container_name: streamguard-postgres
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: streamguard
      POSTGRES_USER: streamguard
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.1
    container_name: streamguard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    restart: unless-stopped
  debezium:
    image: quay.io/debezium/connect:3.2
    container_name: streamguard-debezium
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: streamguard-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: streamguard-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: streamguard-pgadmin
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@streamguard.com
      PGADMIN_DEFAULT_PASSWORD: "StreamGuardLocal123!"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
  debezium-ui:
    image: quay.io/debezium/debezium-ui:latest
    container_name: streamguard-debezium-ui
    depends_on:
      - debezium
    ports:
      - "8081:8080"
    environment:
      KAFKA_CONNECT_URIS: http://debezium:8083
    restart: unless-stopped
  spark:
    image: spark:4.2.0-scala2.13-java17-python3-ubuntu
    container_name: streamguard-spark
    depends_on:
      - kafka
    ports:
      - "4040:4040"
    volumes:
      - ./src:/opt/streamguard/src
      - ./lake:/opt/streamguard/lake
    working_dir: /opt/streamguard
    command: ["bash", "-lc", "sleep infinity"]
    restart: unless-stopped


volumes:
  postgres_data:
  pgadmin_data:
